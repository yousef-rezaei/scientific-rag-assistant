[project]
name = "scientific-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yousef Rezaei Mirghaed", email = "yousefrezaeim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-huggingface>=1.2.3",
    "langchain-postgres>=0.0.19",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
scientific-rag-assistant = "scientific_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
